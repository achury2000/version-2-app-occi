# 8G suele empeorar el build en PCs con poca RAM (swap + GC thrashing). 3–4G suele ir mejor.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Dhttps.protocols=TLSv1.2,TLSv1.3
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.experimental.disableCompileSdkImageJvmModule=true
android.experimental.treatDefaultProguardConfigAsOptional=true
